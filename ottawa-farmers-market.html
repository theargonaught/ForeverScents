<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Find Forever Scents at the Ottawa Farmer's Market every Saturday morning. Handmade soy candles, wax melts & fresh baked breads in Ottawa, Illinois.">
  <title>Ottawa Farmer's Market – Forever Scents</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* MAP PLACEHOLDER */
    .map-placeholder {
      width: 100%;
      height: 320px;
      background: var(--pale);
      border: 2px dashed var(--lavender);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      color: var(--muted);
      font-size: 0.88rem;
      text-align: center;
      padding: 1rem;
    }
    .map-placeholder .map-icon { font-size: 2.5rem; }
    .map-placeholder strong { color: var(--deep); font-size: 1rem; display: block; }

    /* MARKET TABLE */
    .market-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    .market-table thead {
      background: var(--grad);
      color: var(--white);
    }
    .market-table thead th {
      padding: 0.85rem 1rem;
      text-align: left;
      font-family: 'Nunito Sans', sans-serif;
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .market-table tbody tr {
      border-bottom: 1px solid rgba(61,31,110,0.08);
      transition: background 0.15s;
    }
    .market-table tbody tr:hover { background: var(--pale); }
    .market-table tbody tr.past { opacity: 0.45; }
    .market-table td {
      padding: 0.8rem 1rem;
      color: var(--deep);
      vertical-align: middle;
    }
    .market-table td.date-col { font-weight: 600; }
    .market-table td.time-col { color: var(--muted); }
    .badge-upcoming {
      display: inline-block;
      background: var(--grad);
      color: var(--white);
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.2rem 0.55rem;
      border-radius: 50px;
      margin-left: 0.5rem;
      vertical-align: middle;
    }

    /* INFO CARDS */
    .info-card {
      background: var(--white);
      border: 1.5px solid rgba(61,31,110,0.1);
      border-radius: var(--radius);
      padding: 1.4rem 1.25rem;
      display: flex;
      gap: 0.9rem;
      align-items: flex-start;
    }
    .info-card .ic-icon { font-size: 1.6rem; flex-shrink: 0; }
    .info-card h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--deep);
      margin-bottom: 0.3rem;
    }
    .info-card p {
      font-size: 0.84rem;
      color: var(--muted);
      line-height: 1.7;
    }

    @media (min-width: 768px) {
      .map-placeholder { height: 420px; }
    }

    .finished {text-decoration: line-through;}
  </style>
</head>
<body class="page-body">

  <div class="page-hero">
    <h1>Ottawa <em style="color:var(--gold-lt);">Farmer's Market</em></h1>
    <p>We want to thank everybody for a great 2026 season.<br>  We'll see you in spring 2027!</p>
   <!-- <p>Find us every Saturday morning in Ottawa, Illinois — stocked with handmade 
      soy candles, wax melts, and fresh baked sweet breads.</p>-->
  </div>

  


 

  <!-- CTA -->
  <section class="content-section bg-white" style="padding-top:2rem; padding-bottom:2.5rem;">
    <div class="content-inner" style="text-align:center;">

      <div style="display:flex; gap:0.75rem; justify-content:center; flex-wrap:wrap;">
        <a href="order-online.html" class="btn btn-gold">Shop Online</a>
        <a href="contact-us.html" class="btn btn-outline-purple">Contact Us</a>
      </div>
    </div>
  </section>

  <script src="shared.js"></script>
</body>
</html>
